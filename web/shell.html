<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: sans-serif; overflow: hidden; }
		#canvas { display: block; width: 100%; height: 100%; }
		#message { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 1em; white-space: pre-wrap; }
		#status { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; font-size: 1.1em; color: #aaa; pointer-events: none; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas"></canvas>
	<div id="message"></div>
	<div id="status">Loading…</div>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const canvas = document.getElementById('canvas');
		const message = document.getElementById('message');

		const status = document.getElementById('status');

		function fail(text) {
			canvas.style.display = 'none';
			status.style.display = 'none';
			message.textContent = text;
			message.style.display = 'flex';
		}

		// Until the game is running, anything that goes wrong is put on the page, with the browser
		// it happened in, so it can be read and reported without opening developer tools.
		function failWhileLoading(what) {
			if (!window.sierraStarted) {
				fail('The game could not start.\n\n' + what + '\n\n' + navigator.userAgent);
			}
		}
		window.addEventListener('error', (e) => failWhileLoading(e.message || String(e.error)));
		window.addEventListener('unhandledrejection', (e) => failWhileLoading(String(e.reason && e.reason.message || e.reason)));

		// Over plain HTTP the browser has no audioContext.audioWorklet, which the engine needs to start.
		// Probe on a throwaway canvas so the game canvas stays untouched.
		const probe = document.createElement('canvas');
		if (!window.isSecureContext) {
			fail('This game must be opened over HTTPS');
		} else if (!probe.getContext('webgl2')) {
			fail('This game needs WebGL2. Please use a current desktop browser with hardware acceleration enabled.');
		} else {
			const onProgress = (current, total) => {
				status.textContent = total > 0 ? 'Loading… ' + Math.round(100 * current / total) + '%' : 'Loading…';
			};
			new Engine(GODOT_CONFIG).startGame({ canvas, onProgress })
				.then(() => { window.sierraStarted = true; status.style.display = 'none'; })
				.catch((err) => fail('The game could not start.\n\n' + (err && err.message || err) + '\n\n' + navigator.userAgent));
		}
	</script>
</body>
</html>
