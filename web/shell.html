<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: sans-serif; overflow: hidden; }
		#canvas { display: block; width: 100%; height: 100%; }
		#message { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 1em; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas"></canvas>
	<div id="message"></div>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const canvas = document.getElementById('canvas');
		const message = document.getElementById('message');

		function fail(text) {
			canvas.style.display = 'none';
			message.textContent = text;
			message.style.display = 'flex';
		}

		// Over plain HTTP the browser has no audioContext.audioWorklet, which the engine needs to start.
		// Probe on a throwaway canvas so the game canvas stays untouched.
		const probe = document.createElement('canvas');
		if (!window.isSecureContext) {
			fail('This game must be opened over HTTPS');
		} else if (!probe.getContext('webgl2')) {
			fail('This game needs WebGL2. Please use a current desktop browser with hardware acceleration enabled.');
		} else {
			new Engine(GODOT_CONFIG).startGame({ canvas }).then(() => { window.sierraStarted = true; }).catch((err) => fail('Failed to start: ' + err.message));
		}
	</script>
</body>
</html>
