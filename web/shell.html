<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: sans-serif; overflow: hidden; }
		#canvas { display: block; width: 100%; height: 100%; }
		#message { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 1em; white-space: pre-wrap; }
		#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9em; background: #0b0d12; pointer-events: none; }
		#status h1 { margin: 0; font-size: 2.2em; font-weight: 600; color: #e0492f; }
		#bar { width: min(26em, 70vw); height: 0.7em; border: 1px solid #555; border-radius: 0.4em; overflow: hidden; }
		#fill { width: 0; height: 100%; background: #e0492f; transition: width 0.15s linear; }
		#percent { color: #aaa; font-size: 0.95em; min-height: 1.2em; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas"></canvas>
	<div id="message"></div>
	<div id="status">
		<h1>$GODOT_PROJECT_NAME</h1>
		<div id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
		<div id="percent">Loading…</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const canvas = document.getElementById('canvas');
		const message = document.getElementById('message');

		const status = document.getElementById('status');

		// The page speaks the language the game will: the address's (?lang=), else the one chosen
		// in the game before, else the browser's. See src/core/language.gd.
		const SPANISH = {
			'Loading… ': 'Cargando… ',
			'Starting…': 'Empezando…',
			'The game could not start.': 'El juego no ha podido empezar.',
			'This game must be opened over HTTPS': 'Este juego tiene que abrirse por HTTPS',
			'This game needs WebGL2. Please use a current desktop browser with hardware acceleration enabled.':
				'Este juego necesita WebGL2. Usa un navegador de escritorio actual con la aceleración por hardware activada.',
		};
		let language = new URLSearchParams(location.search).get('lang');
		if (language !== 'en' && language !== 'es') {
			try { language = localStorage.getItem('sierra-roja-language'); } catch (e) { language = null; }
		}
		if (language !== 'en' && language !== 'es') {
			language = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
		}
		document.documentElement.lang = language;
		const t = (text) => language === 'es' && SPANISH[text] || text;
		document.getElementById('percent').textContent = t('Loading… ').trim();

		function fail(text) {
			canvas.style.display = 'none';
			status.style.display = 'none';
			message.textContent = text;
			message.style.display = 'flex';
		}

		// Until the game is running, anything that goes wrong is put on the page, with the browser
		// it happened in, so it can be read and reported without opening developer tools.
		function failWhileLoading(what) {
			if (!window.sierraStarted) {
				fail(t('The game could not start.') + '\n\n' + what + '\n\n' + navigator.userAgent);
			}
		}
		window.addEventListener('error', (e) => failWhileLoading(e.message || String(e.error)));
		window.addEventListener('unhandledrejection', (e) => failWhileLoading(String(e.reason && e.reason.message || e.reason)));

		// Over plain HTTP the browser has no audioContext.audioWorklet, which the engine needs to start.
		// Probe on a throwaway canvas so the game canvas stays untouched.
		const probe = document.createElement('canvas');
		if (!window.isSecureContext) {
			fail(t('This game must be opened over HTTPS'));
		} else if (!probe.getContext('webgl2')) {
			fail(t('This game needs WebGL2. Please use a current desktop browser with hardware acceleration enabled.'));
		} else {
			// Downloading fills the bar; after that the browser still has to prepare the engine, which
			// can take some seconds with nothing to count, so the line says so.
			const bar = document.getElementById('bar');
			const fill = document.getElementById('fill');
			const percent = document.getElementById('percent');
			const onProgress = (current, total) => {
				if (total > 0) {
					const done = Math.min(100, Math.round(100 * current / total));
					fill.style.width = done + '%';
					bar.setAttribute('aria-valuenow', done);
					percent.textContent = done < 100 ? t('Loading… ') + done + '%' : t('Starting…');
				}
			};
			new Engine(GODOT_CONFIG).startGame({ canvas, onProgress })
				.then(() => { window.sierraStarted = true; status.style.display = 'none'; })
				.catch((err) => fail(t('The game could not start.') + '\n\n' + (err && err.message || err) + '\n\n' + navigator.userAgent));
		}
	</script>
</body>
</html>
