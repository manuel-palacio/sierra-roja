# Every push to main: run the tests, export the game for the web and deploy it to Fly.io.
# The same steps as ops/test.sh and ops/deploy-fly.sh, on a clean machine. A push whose tests
# fail deploys nothing, and the site stays as it was.
#
# Needs one repository secret, FLY_API_TOKEN: a deploy token for the app in fly.toml.
#   fly tokens create deploy -a sierra-roja | gh secret set FLY_API_TOKEN
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in the order of the pushes; a newer push waits for an older one to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The editor, and the one export template the game uses (web, no threads), kept between runs:
      # the full set of templates is over a gigabyte.
      - name: Restore Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Download Godot
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL -o /tmp/godot.zip "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Put Godot on the path
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      # A fresh checkout has no .godot/: the first run imports every asset and names every class.
      - name: Import the project
        run: |
          godot --version
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Test
        run: ops/test.sh

      - name: Export for the web
        run: ops/build-web.sh

      - name: Check there is a game to deploy
        run: |
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::The FLY_API_TOKEN secret is not set, so nothing was deployed. See the top of this file."
            exit 1
          fi
          flyctl deploy --ha=false

      - name: Check the site answers
        run: curl -fsS -o /dev/null --retry 5 --retry-delay 5 https://sierra-roja.fly.dev/
