# Static files for the game. The engine is one large .wasm file, so it is sent compressed.
server {
	listen 8080;
	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types application/wasm application/javascript application/octet-stream text/css text/plain;

	# A new build changes these files without changing their names.
	add_header Cache-Control "no-cache";

	location / {
		try_files $uri $uri/ =404;
	}
}
